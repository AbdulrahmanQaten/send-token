<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>التحقق من رقم الهاتف</title>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input { padding: 10px; width: 300px; }
    button { padding: 10px 20px; margin-top: 10px; }
    #recaptcha-container { margin-top: 15px; }
  </style>
</head>
<body>

  <h2>تسجيل الدخول برقم الهاتف</h2>
  <input type="text" id="phone" placeholder="مثال: +9677xxxxxxx">
  <div id="recaptcha-container"></div>
  <button onclick="sendCode()">إرسال رمز التحقق</button>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC10f_Ic37l53XPPkaa45TLqSg5D7DcHeQ",
      authDomain: "tajroba-db167.firebaseapp.com",
      projectId: "tajroba-db167",
      storageBucket: "tajroba-db167.appspot.com",
      messagingSenderId: "248020881169",
      appId: "1:248020881169:web:c834cb6f68f8df57a1c6b0"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
      'size': 'normal',
      'callback': function(response) {
        console.log("reCAPTCHA verified");
      }
    });

    function sendCode() {
      const phoneNumber = document.getElementById("phone").value.trim();
      if (!phoneNumber.startsWith("+")) {
        alert("يجب أن يبدأ الرقم بـ + ثم رمز الدولة");
        return;
      }

      const appVerifier = window.recaptchaVerifier;

      auth.signInWithPhoneNumber(phoneNumber, appVerifier)
        .then(function(confirmationResult) {
          const code = prompt("أدخل رمز التحقق المرسل إلى هاتفك:");
          return confirmationResult.confirm(code);
        })
        .then(function(result) {
          alert("✅ تم التحقق بنجاح!");
          console.log("User:", result.user);
        })
        .catch(function(error) {
          console.error("❌ حدث خطأ:", error.message);
          alert("خطأ: " + error.message);
        });
    }
  </script>

</body>
</html>
